<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会った帳</title>
<meta name="description" content="知人や友達と、いつ・どんな名目で会ったかを記録するアプリ。記録はパスワードで暗号化して端末に保存します。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="会った帳">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --subtle: #eeece7;
    --fg: #1c1b20;
    --muted: #67646c;
    --faint: #9a97a0;
    --border: #e2e0db;
    --border-strong: #cdcac3;
    --accent: #5a4fb0;
    --accent-soft: #ebe8fa;
    --accent-fg: #ffffff;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(28,27,32,.05), 0 6px 16px -10px rgba(28,27,32,.16);
    --radius: 14px;
    --c0: #c2532f; --c0b: #f9e6de;
    --c1: #b0761a; --c1b: #f7ecd6;
    --c2: #2f7a55; --c2b: #e0f0e7;
    --c3: #2a6f99; --c3b: #ddedf6;
    --c4: #5a4fb0; --c4b: #e9e6f8;
    --c5: #a2407a; --c5b: #f5e2ee;
    --c6: #4f7a1f; --c6b: #e8f1db;
    --c7: #6b6861; --c7b: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --card: #201f25; --subtle: #2a2930; --fg: #efeef3; --muted: #a7a4ae; --faint: #7a7782;
      --border: #33323a; --border-strong: #45444d; --accent: #a89cf2; --accent-soft: #2e2a48; --accent-fg: #17142c;
      --danger: #f2867e; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px -10px rgba(0,0,0,.6);
      --c0: #f09a78; --c0b: #3c241b;
      --c1: #e7b866; --c1b: #382c15;
      --c2: #7cc9a0; --c2b: #1d3328;
      --c3: #7fbde3; --c3b: #1a2d3a;
      --c4: #a89cf2; --c4b: #2b2745;
      --c5: #e89ac7; --c5b: #3a2131;
      --c6: #a9d27a; --c6b: #26321a;
      --c7: #aaa69d; --c7b: #2c2b28;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 15px; line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
  }
  body.covered #app, body.covered #modal { visibility: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  .hidden { display: none !important; }

  /* ---------- ロック画面 ---------- */
  #lock {
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .lock-box { width: 100%; max-width: 340px; text-align: center; }
  .lock-icon { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; margin: 0 auto 14px; }
  .lock-box h1 { font-size: 22px; margin: 0 0 4px; }
  .lock-box p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .lock-box input {
    width: 100%; font-size: 18px; text-align: center; padding: 12px; border-radius: 12px;
    border: 1px solid var(--border-strong); background: var(--card); margin-bottom: 10px;
  }
  .lock-box input[type=password] { letter-spacing: .2em; }
  .lock-box input::placeholder { letter-spacing: normal; }
  .lock-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lock-err { color: var(--danger); font-size: 13px; min-height: 20px; margin-bottom: 8px; }
  .lock-box .btn { width: 100%; }
  .lock-foot { margin-top: 26px; font-size: 12px; }
  .lock-foot button { color: var(--muted); text-decoration: underline; }
  .note { font-size: 12px; color: var(--muted); text-align: left; background: var(--subtle); border-radius: 10px; padding: 10px 12px; margin-top: 16px; }

  /* ---------- 共通 ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: 12px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
  .btn.sub { background: var(--subtle); color: var(--fg); }
  .btn.ghost { background: transparent; color: var(--accent); padding: 8px 10px; }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }

  header.top {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  header.top h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--subtle); }
  main { max-width: 680px; margin: 0 auto; padding: 14px 16px calc(150px + env(safe-area-inset-bottom)); }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--card);
    border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button { flex: 1; padding: 8px 0 7px; font-size: 11px; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; }
  nav.tabs button[aria-current=page] { color: var(--accent); }
  .fab {
    position: fixed; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 6;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.45); border-radius: 999px; padding: 13px 20px;
  }

  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .sum div { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; }
  .sum small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .sum b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .sum b span { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 2px; }

  .tools { display: flex; gap: 8px; margin-bottom: 12px; }
  .tools input, .tools select { min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); font-size: 14px; }
  .tools input { flex: 1; }
  .tools select { max-width: 42%; }

  .month { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 2px 8px; display: flex; justify-content: space-between; }
  .month:first-child { margin-top: 4px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 14px; box-shadow: var(--shadow);
  }
  .item .d { flex: none; width: 34px; text-align: center; line-height: 1.1; padding-top: 2px; }
  .item .d b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .item .d small { font-size: 11px; color: var(--muted); }
  .item .d small.sun { color: var(--c0); } .item .d small.sat { color: var(--c3); }
  .item .body { flex: 1; min-width: 0; }
  .item .t { font-weight: 700; overflow-wrap: anywhere; }
  .item .ppl { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .y { font-size: 11px; color: var(--faint); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 2px; white-space: nowrap; background: var(--c7b); color: var(--c7); }
  .k0 { background: var(--c0b); color: var(--c0); } .k1 { background: var(--c1b); color: var(--c1); } .k2 { background: var(--c2b); color: var(--c2); } .k3 { background: var(--c3b); color: var(--c3); }
  .k4 { background: var(--c4b); color: var(--c4); } .k5 { background: var(--c5b); color: var(--c5); } .k6 { background: var(--c6b); color: var(--c6); } .k7 { background: var(--c7b); color: var(--c7); }

  .person { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; box-shadow: var(--shadow); }
  .avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .person .body { flex: 1; min-width: 0; }
  .person .n { font-weight: 700; overflow-wrap: anywhere; }
  .person .s { font-size: 12px; color: var(--muted); }
  .person .cnt { flex: none; text-align: right; font-size: 12px; color: var(--muted); }
  .person .cnt b { display: block; font-size: 18px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .person .ago { color: var(--fg); font-weight: 600; }
  .person .ago.long { color: var(--c0); }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; }
  .empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }

  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; margin-bottom: 10px; padding: 4px 0; }
  .prof { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .prof .avatar { width: 56px; height: 56px; font-size: 22px; }
  .prof h2 { margin: 0; font-size: 21px; overflow-wrap: anywhere; }
  .prof .s { color: var(--muted); font-size: 13px; }
  .pmemo { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .stats div { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; }
  .stats small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .stats b { font-size: 17px; }
  .stats b span { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  h3.sec { font-size: 13px; color: var(--muted); margin: 18px 2px 8px; }
  .bars { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .bars .r { display: grid; grid-template-columns: 7.5em 1fr 2.2em; align-items: center; gap: 8px; font-size: 13px; }
  .bars .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .r i { display: block; height: 8px; border-radius: 4px; min-width: 4px; }
  .bars .r em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .tag em { font-style: normal; color: var(--muted); margin-left: 4px; font-size: 12px; }

  /* ---------- 設定 ---------- */
  .group { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .group h2 { font-size: 13px; color: var(--muted); margin: 0; padding: 12px 14px 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--border); }
  .group h2 + .row { border-top: 0; }
  .row .l { flex: 1; min-width: 0; }
  .row .l small { display: block; color: var(--muted); font-size: 12px; }
  .row select { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--subtle); }
  button.row { width: 100%; text-align: left; }
  button.row.dz { color: var(--danger); font-weight: 600; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 12px; }
  .cats .badge { font-size: 13px; padding: 4px 4px 4px 10px; margin: 0; display: inline-flex; align-items: center; gap: 2px; }
  .cats .badge button { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; opacity: .75; }
  .cats .badge button:hover { opacity: 1; background: rgba(127,127,127,.15); }
  .about { font-size: 12px; color: var(--muted); padding: 4px 4px 0; }

  /* ---------- モーダル ---------- */
  #modal { position: fixed; inset: 0; z-index: 20; background: rgba(10,10,14,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow: auto;
    border-radius: 18px 18px 0 0; padding: 0 16px calc(18px + env(safe-area-inset-bottom));
    overscroll-behavior: contain;
  }
  @media (min-width: 600px) { #modal { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet-head { position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 12px 0 10px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .sheet-head h2 { font-size: 16px; margin: 0; }
  label.f { display: block; margin: 12px 0; }
  label.f > span, .f-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
  label.f input, label.f textarea, label.f select, .pp-box {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--card); font-size: 16px;
  }
  label.f textarea { min-height: 84px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
  .two label.f { margin: 0; }
  .fblock { margin: 12px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: inline-block; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--card); font-size: 14px; cursor: pointer; }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pp-box { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 8px; min-height: 46px; }
  .pp-box:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pp-box input { flex: 1; min-width: 8em; border: 0; outline: 0; background: transparent; padding: 3px 4px; font-size: 16px; }
  .pp-chip { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 14px; font-weight: 600; }
  .pp-chip.new { border: 1px dashed var(--accent); }
  .pp-chip button { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sugg button { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 13px; }
  .sugg button.add { border-style: dashed; border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .sugg .hint { font-size: 12px; color: var(--faint); align-self: center; }
  .sheet-foot { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
  .sheet-foot .grow { flex: 1; }

  #toast {
    position: fixed; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
    background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); max-width: calc(100vw - 32px); text-align: center;
    transition: opacity .2s; opacity: 0; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="lock" class="hidden"></div>
<div id="app" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
(function(){
'use strict';

/* =========================================================
   保存と暗号化
   記録はすべて AES-GCM(256bit) で暗号化して localStorage に置く。
   鍵はパスワードから PBKDF2-SHA256 で導出し、メモリ上にだけ持つ。
   ========================================================= */
var LS_VAULT = 'atta-cho:vault';
var LS_FAIL  = 'atta-cho:fails';
var ITER = 310000;
var enc = new TextEncoder(), dec = new TextDecoder();

var key = null;      // CryptoKey（ロック中は null）
var salt = null;     // Uint8Array
var iter = ITER;
var userId = '';     // ユーザーID（iPhone のパスワード保存で ID とパスワードを組にするため。鍵の材料にも混ぜる）
var D = null;        // 復号したデータ（ロック中は null）

// ID とパスワードから鍵の材料を作る（ID のない旧形式はパスワードだけ）
function secretOf(user, pass){ return user ? user + '\u0000' + pass : pass; }

function b64e(u8){ var s = ''; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function rand(n){ return crypto.getRandomValues(new Uint8Array(n)); }

function deriveKey(pass, saltU8, it){
  return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: saltU8, iterations: it, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  });
}
function seal(k, saltU8, it, user, text){
  var iv = rand(12);
  return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, enc.encode(text)).then(function(ct){
    return { app: 'atta-cho', v: 2, user: user, iter: it, salt: b64e(saltU8), iv: b64e(iv), ct: b64e(new Uint8Array(ct)) };
  });
}
function open_(k, box){
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(box.iv) }, k, b64d(box.ct)).then(function(pt){ return dec.decode(pt); });
}
function readVault(){ try { var v = JSON.parse(localStorage.getItem(LS_VAULT)); return v && v.ct ? v : null; } catch (e) { return null; } }

var saving = Promise.resolve();
function save(){
  if (!key || !D) return;
  D.savedAt = Date.now();
  var text = JSON.stringify(D), k = key, s = salt, it = iter, u = userId;
  saving = saving.then(function(){ return seal(k, s, it, u, text); })
    .then(function(box){ localStorage.setItem(LS_VAULT, JSON.stringify(box)); })
    .catch(function(e){ toast('保存できませんでした: ' + (e && e.message || e)); });
  return saving;
}

/* ---------- 失敗回数による待ち時間 ---------- */
function failState(){ try { return JSON.parse(localStorage.getItem(LS_FAIL)) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } }
function addFail(){
  var f = failState(); f.n++;
  if (f.n >= 5) f.until = Date.now() + Math.min(3600, 30 * Math.pow(2, f.n - 5)) * 1000;
  localStorage.setItem(LS_FAIL, JSON.stringify(f));
  return f;
}

/* =========================================================
   データ
   ========================================================= */
var DEFAULT_CATS = ['食事', '飲み会', 'お茶・カフェ', '遊び・レジャー', '旅行', 'お祝い', '冠婚葬祭', '仕事・打合せ', '勉強会・イベント', 'オンライン', 'その他'];
var DEFAULT_GROUPS = ['友達', '知人', '同僚', '仕事関係', '学校', '家族・親戚', 'ご近所'];

function emptyData(){
  return { v: 1, people: [], meets: [], cats: DEFAULT_CATS.slice(), settings: { autoLock: 5 }, savedAt: 0 };
}
function normalize(d){
  d = d || {};
  var out = emptyData();
  out.people = Array.isArray(d.people) ? d.people.filter(function(p){ return p && p.id && p.name; }) : [];
  out.meets = Array.isArray(d.meets) ? d.meets.filter(function(m){ return m && m.id && m.date; }) : [];
  out.meets.forEach(function(m){ if (!Array.isArray(m.people)) m.people = []; });

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id){ return document.getElementById(id); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseD(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
var WD = ['日', '月', '火', '水', '木', '金', '土'];
function fmtD(s){ var d = parseD(s); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
function daysSince(s){ return Math.round((parseD(todayStr()) - parseD(s)) / 86400000); }
function ago(s){
  var n = daysSince(s);
  if (n < 0) return (-n) + '日後';
  if (n === 0) return '今日';
  if (n === 1) return '昨日';
  if (n < 45) return n + '日前';
  if (n < 365) return Math.round(n / 30.4) + 'か月前';
  var y = Math.floor(n / 365), m = Math.round((n - y * 365) / 30.4);
  return y + '年' + (m ? m + 'か月' : '') + '前';
}

var waitTimer;
function tickWait(){
  clearTimeout(waitTimer);
  var f = failState(), btn = $('lockBtn'), inp = $('pc');
  if (!btn || !inp) return;
  var rest = Math.ceil((f.until - Date.now()) / 1000);
  if (rest > 0) {
    btn.disabled = true; inp.disabled = true;
    $('lockErr').textContent = f.n + '回まちがえたため、あと' + (rest >= 60 ? Math.ceil(rest / 60) + '分' : rest + '秒') + '待ってください';
    waitTimer = setTimeout(tickWait, 1000);
  } else {
    if (btn.disabled) { btn.disabled = false; inp.disabled = false; $('lockErr').textContent = ''; inp.focus(); }
  }
}

function doSetup(){
  var u = $('uid1').value.trim(), a = $('pc1').value, b = $('pc2').value, err = $('lockErr');
  if (!u) { err.textContent = 'ユーザーIDを入れてください'; $('uid1').focus(); return; }
  if (a.length < 4) { err.textContent = 'パスワードは4文字以上にしてください'; return; }
  if (a !== b) { err.textContent = '2回のパスワードが一致しません'; $('pc2').value = ''; $('pc2').focus(); return; }
  $('lockBtn').disabled = true; err.textContent = '';
  salt = rand(16); iter = ITER; userId = u;
  deriveKey(secretOf(u, a), salt, iter).then(function(k){
    key = k; D = emptyData();
    return save();
  }).then(function(){ localStorage.removeItem(LS_FAIL); enterApp(); toast('ユーザーIDとパスワードを設定しました'); });
}

function doUnlock(){
  var u = $('uid').value.trim(), pass = $('pc').value, box = readVault(), err = $('lockErr'), btn = $('lockBtn');
  if (!box) { showLock('setup'); return; }
  if (!u) { err.textContent = 'ユーザーIDを入れてください'; $('uid').focus(); return; }
  if (failState().until > Date.now()) { tickWait(); return; }
  btn.disabled = true; err.textContent = '確認しています…';
  var legacy = !box.user;   // ID を導入する前の形式（パスワードだけで暗号化）
  var s = b64d(box.salt), it = box.iter || ITER, k;
  deriveKey(legacy ? pass : secretOf(u, pass), s, it).then(function(kk){ k = kk; return open_(k, box); }).then(function(text){
    D = normalize(JSON.parse(text));
    localStorage.removeItem(LS_FAIL);
    if (!legacy) { key = k; salt = s; iter = it; userId = u; return; }
    // 旧形式 → 入力された ID を組み込んで暗号化し直す
    var ns = rand(16);
    return deriveKey(secretOf(u, pass), ns, ITER).then(function(nk){ key = nk; salt = ns; iter = ITER; userId = u; return save(); });
  }).then(function(){
    enterApp();
    if (legacy) toast('ユーザーID「' + u + '」を設定しました');
  }, function(){
    var f = addFail();
    $('pc').value = '';
    btn.disabled = false;
    err.textContent = 'ユーザーIDかパスワードがちがいます' + (f.n >= 3 && f.n < 5 ? '（あと' + (5 - f.n) + '回で待ち時間が入ります）' : '');
    tickWait();
    if (!$('pc').disabled) $('pc').focus();
  });
}

});

    if (key && D && D.settings.autoLock === 0) lockNow();
  } else {
    if (key && D) {
      var min = D.settings.autoLock;
      if (min > 0 && Date.now() - Math.max(hiddenAt, lastActive) > min * 60000) { lockNow(); return; }
      lastActive = Date.now();
    }
    document.body.classList.remove('covered');
  }
});

function viewMeets(){
  var now = new Date(), y = String(now.getFullYear()), ym = y + '-' + pad(now.getMonth() + 1);
  var nYear = 0, nMonth = 0;

  var h = '<div class="sum"><div><small>今月</small><b>' + nMonth + '<span>回</span></b></div><div><small>' + y + '年</small><b>' + nYear + '<span>回</span></b></div><div><small>登録した人</small><b>' + D.people.length + '<span>人</span></b></div></div>';

  }
  var catsUsed = {}; D.meets.forEach(function(m){ if (m.cat) catsUsed[m.cat] = 1; });

  var q = UI.q.trim().toLowerCase();

    return q.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
  });

function viewPeople(){
  if (!D.people.length) {
    return '<div class="empty"><b>まだ誰も登録されていません</b>会った記録をつけるときに名前を入れると、ここに自動で並びます。<br><br><button class="btn sub" data-act="new-person">＋ 人を登録する</button></div>';
  }

    if (!q) return true;
    return (p.name + ' ' + (p.kana || '') + ' ' + (p.group || '') + ' ' + (p.memo || '')).toLowerCase().indexOf(q) >= 0;
  });
  var byName = function(a, b){ return (a.kana || a.name).localeCompare(b.kana || b.name, 'ja'); };
  list.sort(function(a, b){
    var A = st[a.id], B = st[b.id];

    if (UI.psort === 'long') {           // 会っていない順（記録なしは最後）
      if (!A.last !== !B.last) return A.last ? -1 : 1;
      return (A.last < B.last ? -1 : A.last > B.last ? 1 : 0) || byName(a, b);
    }
    if (A.last !== B.last) return A.last < B.last ? 1 : -1;   // 最近会った順
    return byName(a, b);
  });
  var h = '<div class="tools"><input type="search" id="pq" placeholder="名前・関係で検索" value="' + esc(UI.pq) + '" autocomplete="off">' +

    '</select></div>';
  if (!list.length) return h + '<div class="empty"><b>見つかりません</b></div>';
  h += '<div class="list">' + list.map(function(p){
    var s = st[p.id];

function renderPP(){

function renderSugg(){
  var el = $('ppSugg'); if (!el) return;
  var q = ($('ppInput').value || '').trim();
  var ql = q.toLowerCase();
  var chosen = {}; form.people.forEach(function(x){ if (x.id) chosen[x.id] = 1; });
  var st = personStats();
  var cand = D.people.filter(function(p){
    if (chosen[p.id]) return false;
    return !ql || (p.name + ' ' + (p.kana || '')).toLowerCase().indexOf(ql) >= 0;
  }).sort(function(a, b){
    if (ql) { var as = a.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1, bs = b.name.toLowerCase().indexOf(ql) === 0 ? 0 : 1; if (as !== bs) return as - bs; }
    return (st[b.id].count - st[a.id].count) || (st[a.id].last < st[b.id].last ? 1 : -1);
  }).slice(0, 8);
  var exact = D.people.some(function(p){ return p.name === q; }) || form.people.some(function(x){ return !x.id && x.name === q; });
  var h = '';
  if (!q && cand.length) h += '<span class="hint">よく会う人:</span>';
  h += cand.map(function(p){ return '<button data-act="pp-add" data-id="' + esc(p.id) + '">' + esc(p.name) + '</button>'; }).join('');
  if (q && !exact) h += '<button class="add" data-act="pp-new">＋「' + esc(q) + '」を新しく登録</button>';
  if (!q && !D.people.length && !form.people.length) h = '<span class="hint">名前を入れると、新しい人として登録できます</span>';
  el.innerHTML = h;
}

function saveMeet(asCopy){
  var date = $('fDate').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('日付を入れてください'); return; }
  var pending = ($('ppInput').value || '').trim();
  if (pending) {
    var hit = D.people.filter(function(p){ return p.name === pending; })[0];
    form.people.push(hit ? { id: hit.id } : { name: pending });
  }
  var now = Date.now();
  var ids = [];
  form.people.forEach(function(x){
    var id = x.id;
    if (!id) {
      var same = D.people.filter(function(p){ return p.name === x.name; })[0];
      if (same) id = same.id;
      else { id = uid(); D.people.push({ id: id, name: x.name, kana: '', group: '', memo: '', createdAt: now, updatedAt: now }); }
    }
    if (ids.indexOf(id) < 0) ids.push(id);
  });
  var catEl = document.querySelector('#modal input[name=cat]:checked');
  var data = {
    date: date, time: $('fTime').value || '', cat: catEl ? catEl.value : '',
    title: $('fTitle').value.trim(), people: ids, place: $('fPlace').value.trim(), memo: $('fMemo').value.trim(), updatedAt: now
  };
  var m = form.id && !asCopy ? meetById(form.id) : null;
  if (m) Object.assign(m, data);
  else { data.id = uid(); data.createdAt = now; D.meets.push(data); }
  save(); closeModal(); render();
  toast(asCopy ? '複製して保存しました' : '保存しました');
}

function changePass(){
  var op = $('op').value, nu = $('nu').value.trim(), a = $('np1').value, b = $('np2').value, err = $('passErr');
  if (!nu) { err.textContent = 'ユーザーIDを入れてください'; return; }
  if (a.length < 4) { err.textContent = '新しいパスワードは4文字以上にしてください'; return; }
  if (a !== b) { err.textContent = '新しいパスワードが一致しません'; return; }
  $('passBtn').disabled = true; err.textContent = '確認しています…';
  saving.then(function(){
    var box = readVault();
    return deriveKey(secretOf(box.user, op), b64d(box.salt), box.iter || ITER).then(function(k){ return open_(k, box); });
  }).then(function(){
      var s = rand(16);
      return deriveKey(secretOf(nu, a), s, ITER).then(function(k){ key = k; salt = s; iter = ITER; userId = nu; return save(); });
    }).then(function(){ closeModal(); toast('ユーザーID・パスワードを変更しました'); },
    function(){ err.textContent = 'いまのパスワードがちがいます'; var bt = $('passBtn'); if (bt) bt.disabled = false; });

/* ---------- バックアップ ---------- */
function stamp(){ var d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function doExport(){
  seal(key, salt, iter, userId, JSON.stringify(D)).then(function(box){
    download('atta-cho-backup-' + stamp() + '.json', JSON.stringify(box), 'application/json');
    toast('バックアップを書き出しました');
  });
}
function doCSV(){
  if (!confirm('CSV は暗号化されていないので、誰でも中身を読めます。書き出しますか？')) return;
  var q = function(s){ s = String(s == null ? '' : s); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  var rows = [['日付', '時刻', '種類', '名目', '会った人', '場所', 'メモ']];
  sortedMeets(D.meets).forEach(function(m){ rows.push([m.date, m.time, m.cat, m.title, namesOf(m).join('、'), m.place, m.memo]); });
  download('atta-cho-' + stamp() + '.csv', '﻿' + rows.map(function(r){ return r.map(q).join(','); }).join('\r\n'), 'text/csv');
}
function onImportFile(file){
  var r = new FileReader();
  r.onload = function(){
    var box;
    try { box = JSON.parse(r.result); } catch (e) { toast('読み込めないファイルです'); return; }
    if (!box || !box.ct || !box.iv || !box.salt) { toast('会った帳のバックアップではないようです'); return; }
    // 今と同じ ID・パスワード・salt で書き出したものなら、そのまま開ける
    var tryKey = box.salt === b64e(salt) && (box.user || '') === userId ? Promise.resolve(key) : Promise.reject();
    tryKey.then(function(k){ return open_(k, box); }).then(mergeIn, function(){ importPassForm(box); });
  };
  r.readAsText(file);
}
function importWithPass(){
  var box = form.box, pass = $('ip').value;
  $('ipErr').textContent = '確認しています…';
  deriveKey(secretOf(box.user, pass), b64d(box.salt), box.iter || ITER).then(function(k){ return open_(k, box); })
    .then(function(text){ closeModal(); mergeIn(text); }, function(){ $('ipErr').textContent = 'パスワードがちがいます'; });
}
function mergeIn(text){
  var src;
  try { src = normalize(JSON.parse(text)); } catch (e) { toast('中身を読めませんでした'); return; }
  var added = 0, updated = 0;
  function merge(dst, list){
    list.forEach(function(x){
      var i = -1; for (var j = 0; j < dst.length; j++) if (dst[j].id === x.id) { i = j; break; }
      if (i < 0) { dst.push(x); added++; }
      else if ((x.updatedAt || 0) > (dst[i].updatedAt || 0)) { dst[i] = x; updated++; }
    });
  }
  merge(D.people, src.people);
  merge(D.meets, src.meets);
  src.cats.forEach(function(c){ if (D.cats.indexOf(c) < 0) D.cats.push(c); });
  save(); render();
  toast('読み込みました（追加 ' + added + '件・更新 ' + updated + '件）');
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
  if (act === 'forgot') return forgot();
  if (!D) return;
  switch (act) {
    case 'tab': UI.tab = t.getAttribute('data-tab'); UI.personId = null; render(); window.scrollTo(0, 0); break;
    case 'lock': lockNow(); break;
    case 'new-meet': meetForm(null, t.getAttribute('data-pid')); break;
    case 'edit-meet': meetForm(meetById(id)); break;
    case 'save-meet': saveMeet(false); break;
    case 'dup-meet':
      if (form) { form.id = null; $('fDate').value = todayStr(); $('fTime').value = ''; document.querySelector('.sheet-head h2').textContent = '複製して新しい記録'; t.remove(); var del = document.querySelector('[data-act=del-meet]'); if (del) del.remove(); toast('日付を変えて保存してください'); }
      break;
    case 'del-meet':
      if (confirm('この記録を削除しますか？')) { D.meets = D.meets.filter(function(m){ return m.id !== form.id; }); save(); closeModal(); render(); toast('削除しました'); }
      break;
    case 'pp-add': ppAdd({ id: id }); break;
    case 'pp-new': ppAdd({ name: $('ppInput').value.trim() }); break;
    case 'pp-remove': form.people.splice(+t.getAttribute('data-i'), 1); renderPP(); break;
    case 'open-person': UI.tab = 'people'; UI.personId = id; render(); window.scrollTo(0, 0); break;
    case 'back': UI.personId = null; render(); break;
    case 'new-person': personForm(null); break;
    case 'edit-person': personForm(personById(id)); break;
    case 'save-person': savePerson(); break;
    case 'del-person':
      if (confirm('「' + personById(form.id).name + '」を削除しますか？')) {
        var pid = form.id;
        D.people = D.people.filter(function(p){ return p.id !== pid; });
        D.meets.forEach(function(m){ var i = m.people.indexOf(pid); if (i >= 0) { m.people.splice(i, 1); m.updatedAt = Date.now(); } });
        UI.personId = null; save(); closeModal(); render(); toast('削除しました');
      }
      break;
    case 'close': closeModal(); break;
    case 'change-pass': passForm(); break;
    case 'add-cat':
      var nc = (prompt('追加する種類の名前') || '').trim();
      if (nc && D.cats.indexOf(nc) < 0) { D.cats.push(nc); save(); render(); }
      break;
    case 'rename-cat':
      var i = +t.getAttribute('data-i'), old = D.cats[i];
      var nn = (prompt('新しい名前', old) || '').trim();
      if (nn && nn !== old) {
        if (D.cats.indexOf(nn) >= 0) { toast('同じ名前がすでにあります'); break; }
        D.cats[i] = nn;
        D.meets.forEach(function(m){ if (m.cat === old) { m.cat = nn; m.updatedAt = Date.now(); } });
        if (UI.cat === old) UI.cat = nn;
        save(); render();
      }
      break;
    case 'del-cat':
      var di = +t.getAttribute('data-i');
      if (confirm('「' + D.cats[di] + '」を選択肢から外しますか？（過去の記録の種類はそのまま残ります）')) { D.cats.splice(di, 1); save(); render(); }
      break;
    case 'export': doExport(); break;
    case 'import': $('importFile').value = ''; $('importFile').click(); break;
    case 'csv': doCSV(); break;
    case 'wipe':
      if (confirm('すべての記録と登録した人を消去しますか？') && confirm('本当に消去しますか？この操作は取り消せません。')) {
        var keep = D.settings; D = emptyData(); D.settings = keep; save(); UI.personId = null; render(); toast('消去しました');
      }
      break;
  }
});

document.addEventListener('submit', function(e){
  e.preventDefault();
  var id = e.target.id;
  if (id === 'setupForm') doSetup();
  else if (id === 'unlockForm') doUnlock();
  else if (id === 'passForm') changePass();
  else if (id === 'importForm') importWithPass();
});

document.addEventListener('input', function(e){
  var id = e.target.id;
  if (e.isComposing && (id === 'q' || id === 'pq')) return;   // 変換中は描き直さない
  if (id === 'q') { UI.q = e.target.value; render(); }
  else if (id === 'pq') { UI.pq = e.target.value; render(); }
  else if (id === 'ppInput') renderSugg();
});
document.addEventListener('compositionend', function(e){
  var id = e.target.id;
  if (id === 'q') { UI.q = e.target.value; render(); }
  else if (id === 'pq') { UI.pq = e.target.value; render(); }
});
document.addEventListener('change', function(e){
  var id = e.target.id;
  if (id === 'catFilter') { UI.cat = e.target.value; render(); }
  else if (id === 'psort') { UI.psort = e.target.value; render(); }
  else if (id === 'autoLock') { D.settings.autoLock = +e.target.value; save(); toast('自動ロックを変更しました'); }
  else if (id === 'importFile' && e.target.files[0]) onImportFile(e.target.files[0]);
});
document.addEventListener('keydown', function(e){
  if (e.target.id === 'ppInput') {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      var first = document.querySelector('#ppSugg button');
      if (e.target.value.trim() && first) first.click();
    } else if (e.key === 'Backspace' && !e.target.value && form && form.people.length) {
      form.people.pop(); renderPP(); $('ppInput').focus();
    }
  }
  if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal();
});
$('modal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });

/* =========================================================
   起動
   ========================================================= */
if (!window.crypto || !crypto.subtle) {
  $('lock').classList.remove('hidden');
  $('lock').innerHTML = '<div class="lock-box"><h1>会った帳</h1><p>このブラウザでは暗号化の機能が使えないため開けません。https のページで、新しめのブラウザから開いてください。</p></div>';
} else {
  showLock(readVault() ? 'unlock' : 'setup');
}

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
